<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle geometric pattern -->
  <g opacity="0.08">
    <rect x="0" y="0" width="1200" height="630" fill="url(#pattern)"/>
  </g>
  <defs>
    <pattern id="pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 60 M 0 0 L 60 60" stroke="#22d3ee" stroke-width="0.5" fill="none"/>
    </pattern>
  </defs>
  
  <!-- Accent line -->
  <rect x="120" y="180" width="960" height="2" fill="url(#accentGradient)" rx="1"/>
  
  <!-- Main title -->
  <text x="600" y="260" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2px">
    SS Design Studio
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="335" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="24" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5px">
    Professional Architectural Floor Plan Studio
  </text>
  
  <!-- Tagline -->
  <text x="600" y="385" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="18" font-weight="300" fill="#64748b" text-anchor="middle" letter-spacing="1px">
    2D Blueprints • 3D Holographic View • AI Design Assistant • Gesture Control
  </text>
  
  <!-- Accent line -->
  <rect x="120" y="420" width="960" height="1" fill="url(#accentGradient)" rx="0.5" opacity="0.5"/>
  
  <!-- Brand attribution -->
  <text x="600" y="470" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="16" font-weight="500" fill="#22d3ee" text-anchor="middle" letter-spacing="2px">
    DEVELOPED BY SS DEVELOPMENTS
  </text>
  
  <!-- Corner accents -->
  <g stroke="url(#accentGradient)" stroke-width="2" fill="none">
    <!-- Top-left -->
    <path d="M 80 100 H 140 M 80 100 V 160"/>
    <!-- Top-right -->
    <path d="M 1120 100 H 1060 M 1120 100 V 160"/>
    <!-- Bottom-left -->
    <path d="M 80 530 H 140 M 80 530 V 470"/>
    <!-- Bottom-right -->
    <path d="M 1120 530 H 1060 M 1120 530 V 470"/>
  </g>
</svg>